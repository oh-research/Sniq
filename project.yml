name: Sniq

options:
  bundleIdPrefix: com.ohresearch
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release
  AppStore: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.5.0"
    CURRENT_PROJECT_VERSION: "10"
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ONLY_ACTIVE_ARCH: NO
    ARCHS: "$(ARCHS_STANDARD)"

targets:
  Sniq:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Sniq.icns
      - path: Resources/DefaultSnaps.sniq
    info:
      path: Generated/Info.plist
      properties:
        CFBundleName: Sniq
        CFBundleDisplayName: Sniq
        CFBundleIdentifier: com.ohresearch.sniq
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIconFile: Sniq
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        NSAccessibilityUsageDescription: Sniq needs accessibility access to detect window dragging and resize windows to grid positions.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ohresearch.sniq
        PRODUCT_NAME: Sniq
        DEVELOPMENT_TEAM: GBNQDWF6VV
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Developer ID Application"
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          # Notarization requires a secure timestamp and rejects the
          # get-task-allow debug entitlement that plain `xcodebuild build`
          # injects by default (`archive` handles both automatically).
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        AppStore:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Sniq Mac App Store"
          # Sandbox is an App Store requirement only. A sandboxed process
          # cannot drive other apps via the AX API, so Developer ID builds
          # must stay un-sandboxed or grip/snap dies with kAXErrorCannotComplete.
          CODE_SIGN_ENTITLEMENTS: Sniq.entitlements
